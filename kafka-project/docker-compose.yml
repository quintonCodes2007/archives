services:
  mysql:
    image: mysql:8.4
    container_name: food_delivery_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: food_delivery
      MYSQL_USER: foodapp
      MYSQL_PASSWORD: foodapp

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20


  kafka:

    image: apache/kafka:4.2.2
    container_name: food_delivery_kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

  customer-service:
    build: ./services/customer-service
    container_name: customer_service
    restart: unless-stopped
    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: 3306
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  restaurant-service:
    build: ./services/restaurant-service
    container_name: restaurant_service
    restart: unless-stopped

    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:29092

    ports:
      - "8082:8082"

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started


  order-service:
    build: ./services/order-service
    container_name: order_service
    restart: unless-stopped

    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:29092

    ports:
      - "8083:8083"

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started


  payment-service:
    build: ./services/payment-service
    container_name: payment_service
    restart: unless-stopped

    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:29092

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started


  delivery-service:
    build: ./services/delivery-service
    container_name: delivery_service
    restart: unless-stopped

    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:29092

    ports:
      - "8085:8085"

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started


  notification-service:
    build: ./services/notification-service
    container_name: notification_service
    restart: unless-stopped

    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:29092

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started


  admin-service:
    build: ./services/admin-service
    container_name: admin_service
    restart: unless-stopped

    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: 3306

    ports:
      - "8087:8087"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  kafka_data:
